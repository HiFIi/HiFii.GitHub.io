<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>ThunderDex APKs</title>
      <style>
         /* style.css */
         /* ==========================================================================
         Font Definitions
         ========================================================================== */
         @font-face {
         font-family: 'UberMoveBold';
         src: url('fonts/cashsans_black.otf') format('opentype');
         font-display: swap;
         }
         @font-face {
         font-family: 'categories';
         src: url('fonts/ProductSans-Regular.ttf') format('truetype');
         font-display: swap;
         }
         @font-face {
         font-family: 'LyftProBold';
         src: url('fonts/LyftPro-Bold.ttf') format('truetype');
         font-display: swap;
         }
         @font-face {
         font-family: 'CustomFont';
         src: url('fonts/ProductSans-Play.otf') format('opentype');
         font-display: swap;
         }
         @font-face {
         font-family: 'HeaderFontStyle';
         src: url('fonts/laca_blackitalic.otf') format('opentype');
         font-display: swap;
         }
         @font-face {
         font-family: 'ImportantNotes';
         src: url('fonts/Google_Sans_Display-500-100_0-0_0.ttf') format('truetype');
         font-display: swap;
         }
         /* ==========================================================================
         CSS Variables (Custom Properties)
         ========================================================================== */
         :root {
         --primary-color: #151618;
         --on-primary-color: #ffffff;
         --background-color: #101518;
         --card-background: #281524;
         --important-note-color: #f5f5f5;
         --important-note-background: #100712;
         --build-date-color: #EAEAEA;
         --link-hover-bg: #3A3B47;
         --link-bg: #243034;
         --link-color: #f9f9f9;
         --ripple-color: rgba(255, 255, 255, 0.6);
         --max-content-width: 1000px; /*  Added a max-width variable */
         --border-radius: 12px;     /* Consistent border radius */
         --box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /*  Consistent box shadow */
         --transition-duration: 0.3s; /* Consistent transition duration */
         }
         /* ==========================================================================
         Base Styles
         ========================================================================== */
         html {
         box-sizing: border-box; /*  Better box model */
         scroll-behavior: smooth; /*  Smooth scrolling for anchor links */
         }
         *,
         *::before,
         *::after {
         box-sizing: inherit; /*  Inherit box-sizing */
         }
         body {
         font-family: 'CustomFont', sans-serif;
         font-size: 18px;
         line-height: 1.8;
         margin: 0;
         padding: 25px;
         background: linear-gradient(95deg, #071414, #100712, #331733, #091313, #151618, #091313);
         color: var(--on-primary-color);
         display: flex;            /*  Use Flexbox for layout */
         flex-direction: column;   /*  Stack content vertically */
         min-height: 100vh;         /*  Ensure body takes full viewport height */
         }
         /* ==========================================================================
         Typography
         ========================================================================== */
         h1 {
         font-family: 'HeaderFontStyle', sans-serif;
         font-size: 48px;
         margin-bottom: 20px;
         text-align: center;
         }
         /* ==========================================================================
         Layout & Sections
         ========================================================================== */
         header {
         text-align: center;
         padding: 20px 0;
         }
         main {
         flex: 1;                  /*  Allow main to grow and take available space */
         width: 100%;
         max-width: var(--max-content-width); /*  Limit the width of the content */
         margin: 0 auto;            /*  Center the content horizontally */
         }
         section {
         margin-bottom: 30px;
         }
         /* ==========================================================================
         Download Section
         ========================================================================== */
         .download-section {
         text-align: center;
         margin: 25px 0;
         }
         .download-links a {
         text-decoration: none;
         background-color: var(--link-bg);
         font-weight: 600;
         font-size: 26px;
         padding: 25px 50px;
         border-radius: var(--border-radius);
         color: var(--link-color);
         display: inline-block;
         box-shadow: var(--box-shadow);
         transition: transform var(--transition-duration) ease-in-out,
         box-shadow var(--transition-duration) ease-in-out,
         background-color var(--transition-duration) ease-in-out;
         position: relative;
         overflow: hidden;   /*  Hide the ripple overflow */
         z-index: 1;          /*  Ensure text is above ripple */
         }
         .download-links a::before {
         content: '';
         position: absolute;
         top: 0;
         left: 0;
         width: 100%;
         height: 100%;
         background: var(--ripple-color);
         border-radius: 50%;
         transform: scale(0);
         opacity: 0;        /*  Start invisible */
         transition: transform 0.5s, opacity 1s cubic-bezier(0, 0, 0.3, 1);
         pointer-events: none;
         z-index: -1;       /* Place ripple behind the link's background */
         }
         .download-links a:hover {
         background-color: var(--link-hover-bg);
         box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
         transform: scale(1.05);
         }
         .download-links a:active::before {
         transform: scale(3); /*  Grow to a large size */
         opacity: 0;          /*  Fade out completely */
         }
         /* ==========================================================================
         Changelog Section
         ========================================================================== */
         .changelog-section {
         display: flex;
         flex-direction: column;
         justify-content: center;
         margin: 20px auto;
         max-width: var(--max-content-width);
         text-align: center;
         }
         .changelog-box {
         background-color: var(--card-background);
         border-radius: var(--border-radius);
         padding: 25px;
         box-shadow: var(--box-shadow);
         font-size: 24px;
         line-height: 1.8;
         color: var(--on-primary-color);
         max-width: 100%;
         text-align: left;
         }
         .changelog-title {
         font-family: 'UberMoveBold', sans-serif;
         font-size: 44px;
         margin-top: 15px;
         margin-bottom: 15px;
         text-align: left;
         }
         .changelog-section ul {
         list-style-type: disc;
         padding-left: 20px;
         }
         .changelog-section ul li {
         margin-bottom: 12px;
         }
         /* ==========================================================================
         Important Notes Section
         ========================================================================== */
         .important-notes-section {
         font-family: 'ImportantNotes', sans-serif;
         font-size: 15px;
         background-color: var(--important-note-background);
         color: var(--important-note-color);
         border: 1px solid var(--important-note-color);
         border-radius: var(--border-radius);
         padding: 30px;
         margin: 0 auto 30px;  /*  top right bottom left; */
         list-style-type: none;
         box-shadow: 0 14px 16px rgba(0, 0, 0, 0.85);
         text-align: left;
         max-width: 100%;       /* Ensures it fits within the main container */
         }
         .important-notes-section strong {
         font-family: 'UberMoveBold', sans-serif;
         font-size: 22px;
         display: block;
         margin-bottom: 12px;
         }
         .important-notes-section hr.divider {
         border: 0;
         border-top: 1px solid rgba(255, 255, 255, 0.4);
         margin: 18px 0;
         }
         /* ==========================================================================
         Helper Classes & Components
         ========================================================================== */
         .test-heading,
         .medium-heading {
         font-family: 'UberMoveBold', sans-serif;
         font-size: 22px;
         margin-top: 20px;
         margin-bottom: 12px;
         text-align: left;
         list-style: none;
         }
         .build-info {
         font-size: 32px;
         text-align: center;
         margin: 15px 0;
         color: var(--build-date-color);
         }
         /* ==========================================================================
         Source Code Link
         ========================================================================== */
         .source-code-link {
         position: absolute;
         top: 10px;
         right: 10px;
         background-color: var(--link-bg);
         color: var(--link-color);
         padding: 8px 16px;
         border-radius: 8px;
         text-decoration: none;
         font-size: 16px;
         transition: background-color var(--transition-duration) ease;
         z-index: 10; /* Ensure it's always on top */
         }
         .source-code-link:hover {
         background-color: var(--link-hover-bg);
         }
         /* ==========================================================================
         Media Queries
         ========================================================================== */
         @media (max-width: 768px) {
         body {
         padding: 15px;
         }
         h1 {
         font-size: 30px;
         }
         .important-notes-section {
         font-size: 15px;
         padding: 18px;
         }
         .download-links a {
         font-size: 22px;
         padding: 18px 36px;
         }
         .changelog-box {
         padding: 20px;
         }
         }
      </style>
      <!-- Font Preloading (Critical for Performance) -->
      <link rel="preload" href="fonts/cashsans_black.otf" as="font" type="font/otf" crossorigin="anonymous">
      <link rel="preload" href="fonts/ProductSans-Regular.ttf" as="font" type="font/ttf" crossorigin="anonymous">
      <link rel="preload" href="fonts/LyftPro-Bold.ttf" as="font" type="font/ttf" crossorigin="anonymous">
      <link rel="preload" href="fonts/ProductSans-Play.otf" as="font" type="font/otf" crossorigin="anonymous">
      <link rel="preload" href="fonts/laca_blackitalic.otf" as="font" type="font/otf" crossorigin="anonymous">
      <link rel="preload" href="fonts/Google_Sans_Display-500-100_0-0_0.ttf" as="font" type="font/ttf" crossorigin="anonymous">
   </head>
   <body>
      <a class="source-code-link" href="https://github.com/HiFIi/HiFii.GitHub.io" target="_blank" rel="noopener noreferrer">Source Code</a>
      <header>
         <h1>ThunderDex 6.0.3<br>TBA</h1>
      </header>
      <main>
      <div class="download-section">
      <div class="download-links">
      <a href="https://hifii.github.io/Changelogs">View the 6.0.3 Changelog</a>
      </section>
   </body>
</html>
